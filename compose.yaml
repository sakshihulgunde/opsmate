services:

  app:
    build: .
    container_name: opsmate-app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: opsmate
      DB_USER: opsmate
      DB_PASSWORD: opsmatepass
    depends_on:
      database:
        condition: service_healthy
    networks:
      - opsmate-network

  database:
    image: postgres:16-alpine
    container_name: opsmate-db
    environment:
      POSTGRES_DB: opsmate
      POSTGRES_USER: opsmate
      POSTGRES_PASSWORD: opsmatepass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmate -d opsmate"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - opsmate-network

networks:
  opsmate-network:

volumes:
  postgres-data:
